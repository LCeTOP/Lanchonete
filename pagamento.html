<div class="header-container">
    <img src="assets/Imagens/Logo/img.png" alt="Casal 20 Lanches" class="logo">
    <h1>Pagamento</h1>
    <link rel="stylesheet" href="assets/CSS/pagamento.css">
    <p>Insira os dados do seu cartão</p>
</div>

<div class="checkout-container">
    <form>
        <div class="form-group">
            <label for="nome">Nome no Cartão</label>
            <input type="text" id="nome" placeholder="NOME IMPRESSO NO CARTÃO">
        </div>

        <div class="form-group">
            <label for="numero">Número do Cartão</label>
            <input type="text" id="numero" placeholder="0000 0000 0000 0000">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="validade">Validade</label>
                <input type="text" id="validade" placeholder="MM/AA">
            </div>
            <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" placeholder="123">
            </div>
        </div>

      
        <a href="pedido.html" class="btn-cadastrar">Finalizar Pagamento</a>
        <a href="pix.html" class="btn-cadastrar">Pagar no Pix</a>
        <button type="reset" class="btn-clear">Limpar Campos</button>
    </form>
</div>
