<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aba de Pagamento</title>
</head>
<body>

<h2>Formulário de Pagamento</h2>

<form>

<p>
<label for="metodo">Forma de Pagamento:</label><br>
<select id="metodo" name="metodo">
<option value="cartao">Cartão de Crédito</option>
<option value="pix">Pix</option>
<option value="boleto">Boleto Bancário</option>
</select>
</p>


<fieldset>
<legend>Dados do Cartão</legend>

<table>
<tr>
<td><label for="nome">Nome no Cartão:</label></td>
<td><input type="text" id="nome" name="nome"></td>
</tr>
<tr>
<td><label for="numero">Número do Cartão:</label></td>
<td><input type="text" id="numero" name="numero" placeholder="0000 0000 0000 0000"></td>
</tr>
<tr>
<td><label for="validade">Validade:</label></td>
<td><input type="text" id="validade" name="validade" placeholder="MM/AA" size="5"></td>
</tr>
<tr>
<td><label for="cvv">Código CVV:</label></td>
<td><input type="text" id="cvv" name="cvv" placeholder="123" size="4"></td>
</tr>
<tr>
<td><label for="parcelas">Parcelas:</label></td>
<td>
<select id="parcelas" name="parcelas">
<option value="1">1x sem juros</option>
<option value="2">2x sem juros</option>
<option value="3">3x sem juros</option>
</select>
</td>
</tr>
</table>
</fieldset>

<br>

<!-- Botões de Enviar e Limpar -->
<input type="submit" value="Confirmar Pagamento">
<input type="reset" value="Limpar Campos">
</form>

</body>
</html>
