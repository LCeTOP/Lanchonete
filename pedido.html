<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado - Casal 20</title>
    <link rel="stylesheet" href="assets/CSS/pedido.css">
</head>
<body>

    <div class="container-pedido">
        <div class="topo">
            <img class="logo-hamburgueria" src="assets/Imagens/Logo/img.png" alt="Casal 20 Lanches">
            <h2>Pedido Confirmado! 🎉</h2>
            <p class="numero-pedido">Pedido #7777</p>
        </div>

        <div class="status-container">
            <h3>Status do Pedido</h3>
            <div class="passo ativo"> Pedido Recebido</div>
            <div class="passo ativo"> Em Preparação</div>
            <div class="passo"> Saiu para Entrega</div>
        </div>

        <div class="resumo">
            <h3>Resumo do Pedido</h3>
            <p>1x X-Tudo Casal 20 <span>R$ 28,00</span></p>
            <p>1x Coca-Cola Lata <span>R$ 6,00</span></p>
            <p class="total">Total: <span>R$ 34,00</span></p>
        </div>

        <div class="tempo">
            <p>⏱ Tempo estimado: <strong>30 - 45 min</strong></p>
        </div>

        <a href="menu.html" class="botao-voltar">Voltar ao Menu</a>
    </div>

</body>
</html>
